# Fallback Ingress. Ankra assigns an ankra.cc hostname itself; edit the
# host below when you apply this file by hand. The TLS secret is not created
# here. Point cert-manager at it, or remove the tls block for plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shipyard
  labels:
    app.kubernetes.io/name: shipyard
    app.kubernetes.io/part-of: shipyard
spec:
  rules:
    - host: shipyard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shipyard
                port:
                  number: 80
  tls:
    - hosts:
        - shipyard.example.com
      secretName: shipyard-tls
