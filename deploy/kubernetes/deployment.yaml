# Fallback Deployment for running Shipyard itself.
# Replace shipyard:local with the image Ankra or your registry published.
# This file does not create a cluster and does not contain a secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipyard
  labels:
    app.kubernetes.io/name: shipyard
    app.kubernetes.io/part-of: shipyard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipyard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipyard
        app.kubernetes.io/part-of: shipyard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: shipyard
          image: shipyard:local
          imagePullPolicy: IfNotPresent
          command: ["/shipyard", "serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SHIPYARD_HOME
              value: /var/lib/shipyard
            - name: SHIPYARD_PROVIDER
              value: fake
          # To allow deploy and set_secret over /mcp, create a Secret out of
          # band and uncomment the next block. Do not commit the token.
          # - name: SHIPYARD_HTTP_TOKEN
          #   valueFrom:
          #     secretKeyRef:
          #       name: shipyard-http
          #       key: token
          volumeMounts:
            - name: data
              mountPath: /var/lib/shipyard
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
