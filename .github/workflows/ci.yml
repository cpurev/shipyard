name: ci

on:
  push:
  pull_request:

# Build, vet, test, and lint only.
# This workflow must never deploy and must never call Vercel, GCP, or any
# other cloud API. Tests use the fake provider and httptest.
permissions:
  contents: read

jobs:
  ci:
    name: build vet test lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: ./...
